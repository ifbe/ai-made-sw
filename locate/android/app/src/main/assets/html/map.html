<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link rel="stylesheet" href="lib/leaflet.css" />
    <script src="lib/leaflet.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { width: 100%; height: 100%; overflow: hidden; background: #fff; }
        #map { width: 100%; height: 100%; position: absolute; top: 0; left: 0; }
    </style>
</head>
<body>
<div id="map"></div>
<script>
    var map = null;

    function initMap(lat, lng, zoom) {
        map = L.map('map', {
            center: [lat, lng],
            zoom: zoom || 15,
            zoomControl: false,
            attributionControl: false
        });

        L.tileLayer('https://webrd01.is.autonavi.com/appmaptile?lang=zh_cn&size=1&scale=1&style=8&x={x}&y={y}&z={z}', {
            maxZoom: 19
        }).addTo(map);

        map.on('click', function(e) {
            if (window.Android && window.Android.onMapClick) {
                window.Android.onMapClick(e.latlng.lat, e.latlng.lng);
            }
        });

        map.on('moveend', function() {
            reportCenterAndZoom();
        });

        map.on('zoomend', function() {
            reportCenterAndZoom();
        });

        // 节流：move 事件每 100ms 只触发一次
        var moveTimer = null;
        map.on('move', function() {
            if (moveTimer) return;
            moveTimer = setTimeout(function() {
                moveTimer = null;
                reportCenterAndZoom();
            }, 100);
        });

        // 地图初始化完成，通知 Android
        if (window.Android && window.Android.onMapReady) {
            window.Android.onMapReady();
        }
    }

    function reportCenterAndZoom() {
        if (!map || !window.Android) return;
        var c = map.getCenter();
        var z = map.getZoom();
        var container = map.getContainer();
        console.log('reportCenterAndZoom: z=' + z + ' center=' + c.lat + ',' + c.lng + ' container=' + container.offsetWidth + 'x' + container.offsetHeight);
        if (window.Android.onCenterAndZoom) {
            window.Android.onCenterAndZoom(z, c.lat, c.lng, container.offsetWidth, container.offsetHeight);
        }
    }

    // Android 调用这些方法
    window.MapInterface = {
        moveTo: function(lat, lng, zoom) {
            if (!map) return;
            map.flyTo([lat, lng], zoom || map.getZoom(), {animate: true, duration: 0.5});
        },
        getCenterAndZoom: function() {
            reportCenterAndZoom();
        },
        // 将 GPS 坐标转换为屏幕像素（相对于地图容器左上角）
        latLngToScreen: function(lat, lng) {
            if (!map) return null;
            var point = map.latLngToContainerPoint([lat, lng]);
            return { x: point.x, y: point.y };
        }
    };

    // 初始化（默认显示用户当前位置，启动后由 Android 的 moveTo 修正）
    initMap(31.9, 118.8, 15);  // 南京附近作为初始位置
</script>
</body>
</html>
