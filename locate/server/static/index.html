<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>旅迹 · 实时队友定位</title>
    <!-- 使用 Leaflet 地图库 -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <!-- 引入 CryptoJS -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.2.0/crypto-js.min.js"></script>
    <!-- 自定义样式 -->
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <!-- 登录界面 -->
    <div id="loginPage">
        <div class="login-container">
            <h2>🚐 旅迹·定位</h2>
            <div class="sub">安全认证 · 挑战响应</div>
            <div class="input-group">
                <label>👤 账号</label>
                <input type="text" id="username" placeholder="输入用户名" autocomplete="off">
            </div>
            <div class="input-group">
                <label>🔑 密码</label>
                <input type="password" id="password" placeholder="密码" autocomplete="off">
            </div>
            <button class="login-btn" id="loginBtn">登录</button>
            <div id="loginError" class="error-msg"></div>
            <div style="margin-top: 20px; font-size:12px; opacity:0.5;">
                ⭐ 使用 python3 secret.py add 用户名 添加用户
            </div>
        </div>
    </div>

    <!-- 地图主界面 -->
    <div id="mapPage">
        <!-- 顶部状态栏 -->
        <div class="status-bar">
            <span>👥 在线人数 <span id="onlineCount" class="online-count">0</span></span>
            <span id="currentUserDisplay" style="font-weight:600;">未登录</span>
            <button class="logout-btn" id="logoutBtn">退出</button>
        </div>
        
        <!-- 地图容器 -->
        <div id="map"></div>
        
        <!-- 十字星 -->
        <div class="crosshair"></div>
        
        <!-- 目标设置按钮 -->
        <div class="target-btn" id="targetBtn">🎯 点我设置目标</div>
        
        <!-- 底部控件 -->
        <div class="bottom-controls">
            <!-- 左下：调试按钮和面板 -->
            <div class="bottom-left">
                <div class="debug-btn" id="debugToggle">🔧 调试日志</div>
                <div class="debug-panel" id="debugPanel"></div>
            </div>
            
            <!-- 中下：连接状态和重连按钮 -->
            <div class="bottom-center">
                <div id="connectionStatus" class="connection-status disconnected">⚡ 连接中...</div>
                <div class="reconnect-buttons">
                    <div class="reconnect-btn auto" id="autoReconnectBtn">🔄 自动重连</div>
                    <div class="reconnect-btn manual" id="manualReconnectBtn">👆 手动重连</div>
                </div>
            </div>
            
            <!-- 右下：图例 -->
            <div class="bottom-right">
                <div class="legend">
                    <div class="legend-item">
                        <div class="legend-color" style="background: #ffdf7e;"></div>
                        <span>自己 (本地GPS)</span>
                    </div>
                    <div class="legend-item">
                        <div class="legend-color" style="background: #ff7e7e;"></div>
                        <span>自己 (云端数据)</span>
                    </div>
                    <div class="legend-item">
                        <div class="legend-color" style="background: #7ec8ff;"></div>
                        <span>其他队友</span>
                    </div>
                    <div class="legend-item">
                        <div class="legend-color" style="background: #ffa500;"></div>
                        <span>目标地点 (橙色虚线)</span>
                    </div>
                    <div class="legend-note">🧭 箭头 = 朝向</div>
                </div>
            </div>
        </div>
    </div>

    <!-- 引入 Leaflet -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <!-- 引入自定义JS模块 -->
    <script src="/js/config.js"></script>
    <script src="/js/utils.js"></script>
    <script src="/js/map.js"></script>
    <script src="/js/gps.js"></script>
    <script src="/js/auth.js"></script>
    <script src="/js/websocket.js"></script>
    <script src="/js/main.js"></script>
</body>
</html>
