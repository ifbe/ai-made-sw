<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>旅迹 · 实时队友定位</title>
    <!-- 使用 Leaflet 地图库 -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <!-- 引入 CryptoJS -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.2.0/crypto-js.min.js"></script>
    <!-- 自定义样式 -->
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <!-- 准备页：只做启动准备，准备好直接进地图
         （对应 Android 的 LoginActivity 启动页 / iOS 的 SplashView） -->
    <div id="splashPage">
        <div class="splash-title">旅迹定位</div>
        <div class="loading loading-lg"></div>
    </div>

    <!-- 地图主界面 -->
    <div id="mapPage">
        <!-- 地图容器 -->
        <div id="map"></div>

        <!-- 十字星 -->
        <div class="crosshair"></div>

        <!-- 十字星坐标三行 -->
        <div id="crosshairInfo">
            <span class="crosshair-line" id="infoLng">经度: --</span>
            <span class="crosshair-line" id="infoLat">纬度: --</span>
            <span class="crosshair-line" id="infoAlt">海拔: --</span>
        </div>

        <!-- 未登录时：顶部悬浮的登录矩形（4行：服务器地址 / 用户名 / 密码 / 登录） -->
        <div id="loginCard">
            <div class="login-row">
                <span class="login-label">服务器地址</span>
                <input type="text" id="serverUrl" class="login-input" autocomplete="off" spellcheck="false">
            </div>
            <div class="login-row">
                <span class="login-label">用户名</span>
                <input type="text" id="username" class="login-input" autocomplete="off" spellcheck="false">
            </div>
            <div class="login-row">
                <span class="login-label">密码</span>
                <input type="password" id="password" class="login-input" autocomplete="off">
            </div>
            <div id="loginError" class="login-error"></div>
            <button class="login-btn" id="loginBtn">登录</button>
        </div>

        <!-- 左上角本地设置面板（标题行最右边是退出登录） -->
        <div id="localSettingsPanel">
            <div class="panel-header">
                <span class="panel-title">本地</span>
                <span class="logout-btn" id="logoutBtn">退出登录</span>
            </div>
            <div class="settings-row" id="btnMyLocation">
                <span class="icon">📍</span>
                <span>我的位置</span>
            </div>
            <div class="settings-row" id="btnSetTarget">
                <span class="icon">🎯</span>
                <span id="btnSetTargetText">设目标</span>
            </div>
        </div>

        <!-- 右上角同服人数面板 -->
        <div id="userListPanel">
            <div class="user-list-title" id="userListTitle">同服人数: 0</div>
            <div id="userListContent"></div>
        </div>

        <!-- 左下角日志矩形（对应 Android 的 LogPanel） -->
        <div id="logPanel">
            <div class="log-rows" id="logRows">
                <div class="log-lines" id="logLines"></div>
                <div class="log-scrollbar" id="logScrollbar">
                    <div class="log-thumb" id="logThumb"></div>
                </div>
            </div>
            <div class="log-grip" id="logGrip"></div>
            <div class="log-strip" id="logStrip">
                <span class="log-triangle up" id="logTriangle"></span>
                <span class="log-strip-text" id="logStripText">日志 0</span>
            </div>
        </div>
    </div>

    <!-- 引入 Leaflet -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <!-- 引入自定义JS模块 -->
    <script src="/js/config.js"></script>
    <script src="/js/utils.js"></script>
    <script src="/js/applog.js"></script>
    <script src="/js/map.js"></script>
    <script src="/js/gps.js"></script>
    <script src="/js/auth.js"></script>
    <script src="/js/websocket.js"></script>
    <script src="/js/main.js"></script>
</body>
</html>
