<!-- textimage.html -->
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>文本图像互转 - AI模型集成平台</title>
    <link rel="stylesheet" href="/style.css">
    <style>
        /* 媒体文件列表栏 */
        #mediaList {
            width: 100%;
            max-height: 30vh;
            overflow-y: auto;
            border: 1px solid #ddd;
            border-radius: 4px;
            background: #fff;
            margin-bottom: 0.5rem;
        }
        .media-item {
            padding: 0.4rem 0.8rem;
            font-size: 0.85rem;
            font-family: ui-monospace, Menlo, monospace;
            color: #333;
            cursor: pointer;
            border-bottom: 1px solid #f0f0f0;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .media-item:hover { background: #e3f2fd; }
        .media-item.selected { background: #3498db; color: #fff; }
        .media-empty { padding: 1rem; color: #999; text-align: center; }

        /* 转换按钮矩形卡片：上矩形中心 (50%,25%)，下矩形中心 (50%,75%) */
        .media-rect {
            position: fixed;
            cursor: move;
            left: 50%;
            transform: translate(-50%, -50%);
            background: #fff;
            border: 1px solid #ddd;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            padding: 1.2rem 1.5rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.8rem;
            z-index: 1000;
            min-width: 230px;
        }
        #rectTop { top: 25%; }
        #rectBottom { top: 75%; }
        .media-rect .action-btn { transform: none; }
        .media-rect select {
            width: 100%;
            padding: 0.5rem 0.6rem;
            border: 1px solid #ddd;
            border-radius: 25px;
            font-size: 0.9rem;
            background: #fff;
            color: #333;
            cursor: pointer;
        }
        /* 矩形内状态文本框 */
        .rect-status {
            width: 100%;
            min-height: 1.2em;
            max-height: 90px;
            overflow-y: auto;
            font-size: 0.78rem;
            font-family: ui-monospace, Menlo, monospace;
            line-height: 1.5;
            color: #666;
            text-align: left;
            white-space: pre-wrap;
            word-break: break-word;
        }
        @media (max-width: 768px) {
            .media-rect { position: static; transform: none; margin: 0.6rem auto; }
        }
    </style>
</head>
<body>
    <nav class="top-nav">
        <a href="/">主页</a>
        <a href="/text">文本对话</a>
        <a href="/textaudio">文本语音互转</a>
        <a href="/textimage" class="active">文本图像互转</a>
        <a href="/textvideo">文本视频互转</a>
    </nav>

    <div class="split-container">
        <div class="left-panel">
            <textarea id="inputText" placeholder="请输入要生成图像的文本描述..." class="text-input"></textarea>
        </div>
        <div class="right-panel">
            <div class="preview-area">
                <!-- 图片文件列表栏：点击选中预览；点击空白处上传 -->
                <div id="mediaList"><div class="media-empty">加载中...</div></div>
                <div id="imagePreview" style="width: 100%; text-align: center;">
                    <img id="generatedImage" style="max-width: 100%; max-height: 400px; display: none;">
                    <div id="placeholderText" style="color: #999; padding: 2rem;">点击或拖拽上传图片</div>
                </div>
            </div>
        </div>
    </div>

    <!-- 转换按钮矩形：上矩形=文本转图片；下矩形=图片转文本 + 识别方法（按钮下方） -->
    <div class="media-rect" id="rectTop">
        <select id="imageMethod" title="选择文本转图像使用的模型"></select>
        <div id="imageParams" style="display:none;"></div>
        <button id="textToImage" class="action-btn primary">文本转图像→</button>
        <div id="imageStatus" class="rect-status"></div>
    </div>
    <div class="media-rect" id="rectBottom">
        <select id="captionMethod" title="选择图像转文本使用的模型"></select>
        <div id="captionParams" style="display:none;"></div>
        <button id="imageToText" class="action-btn primary">←图像转文本</button>
        <div id="captionStatus" class="rect-status"></div>
    </div>

    <!-- 隐藏的文件上传输入框 -->
    <input type="file" id="imageFile" accept="image/*" style="display: none;">

    <script src="/script.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const inputText = document.getElementById('inputText');
            const imageFile = document.getElementById('imageFile');
            const generatedImage = document.getElementById('generatedImage');
            const placeholderText = document.getElementById('placeholderText');
            const imageStatusEl = document.getElementById('imageStatus');
            const captionStatusEl = document.getElementById('captionStatus');
            const mediaListEl = document.getElementById('mediaList');

            const MEDIA_TYPE = 'image';
            let currentFile = null;   // 当前选中的文件名

            // ===== 加载可选转换方法（来自配置区），记住上次选择 =====
            const captionMethodSelect = document.getElementById('captionMethod');
            initMethodParams('imageMethod', 'imageParams', 'image');
            initMethodParams('captionMethod', 'captionParams', 'caption');

            // ===== 状态显示（进度历史 / 结果提示），支持刷新恢复 =====
            function setStatus(el, msg) {
                if (msg) {
                    el.textContent = msg;
                    el.style.color = msg.startsWith('❌') ? '#e74c3c' : msg.startsWith('✅') ? '#2ecc71' : '#666';
                    el.scrollTop = el.scrollHeight;   // 自动滚动显示尾部（最新进度）
                } else {
                    el.textContent = '';
                }
            }

            function setStatusFromLines(el, lines) {
                if (!lines || !lines.length) return;
                const texts = [];
                for (const raw of lines) {
                    const last = raw.split('\r').pop()
                        .replace(/\x1b\[[0-9;]*m/g, '')
                        .trim();
                    if (last) texts.push('⏳ ' + last);
                }
                setStatus(el, texts.join('\n'));
            }

            async function fetchTask(task) {
                try {
                    const res = await fetch('/api/task-status/' + task);
                    if (!res.ok) return null;
                    return await res.json();
                } catch (e) { return null; }
            }

            function pollUntil(task, onTick, onDone) {
                const timer = setInterval(async () => {
                    const s = await fetchTask(task);
                    if (!s) return;
                    if (onTick) onTick(s);
                    if (!s.running) {
                        clearInterval(timer);
                        if (onDone) onDone(s);
                    }
                }, 1200);
            }

            // ===== 文件列表：拉取 -> 渲染 -> 默认选中最新（或指定文件）=====
            async function refreshMediaList(selectName) {
                try {
                    const res = await fetch('/api/media/list/' + MEDIA_TYPE);
                    const data = await res.json();
                    const files = data.files || [];
                    mediaListEl.innerHTML = '';
                    if (!files.length) {
                        mediaListEl.innerHTML = '<div class="media-empty">暂无文件，点击或拖拽上传图片</div>';
                        return;
                    }
                    for (const f of files) {
                        const item = document.createElement('div');
                        item.className = 'media-item' + (f === currentFile ? ' selected' : '');
                        item.textContent = f;
                        item.title = f;
                        item.addEventListener('click', (e) => {
                            e.stopPropagation();
                            selectFile(f);
                        });
                        mediaListEl.appendChild(item);
                    }
                    if (selectName && files.includes(selectName)) {
                        selectFile(selectName);
                    } else if (!currentFile || !files.includes(currentFile)) {
                        selectFile(files[0]);
                    }
                } catch (e) {
                    mediaListEl.innerHTML = '<div class="media-empty">加载失败</div>';
                }
            }

            function selectFile(name) {
                currentFile = name;
                document.querySelectorAll('.media-item').forEach(el => {
                    el.classList.toggle('selected', el.textContent === name);
                });
                generatedImage.src = '/image/' + encodeURIComponent(name);
                generatedImage.style.display = 'inline-block';
                placeholderText.style.display = 'none';
            }

            // ===== 上传：真的传到服务器 image/ 文件夹，然后刷新列表并选中 =====
            async function uploadImageFile(file) {
                const fd = new FormData();
                fd.append('file', file);
                try {
                    const res = await fetch('/api/media/upload/' + MEDIA_TYPE, {method: 'POST', body: fd});
                    const data = await res.json();
                    if (!res.ok) throw new Error(data.error || '上传失败');
                    setStatus(captionStatusEl, '✅ 已上传：' + data.name);
                    await refreshMediaList(data.name);
                } catch (e) {
                    alert('上传失败：' + e.message);
                }
            }

            // 点击右侧空白区域 -> 打开文件选择框
            document.querySelector('.right-panel').addEventListener('click', (e) => {
                if (e.target.closest('#mediaList') || e.target.closest('img')) return;
                imageFile.click();
            });

            // 拖拽上传
            document.querySelector('.right-panel').addEventListener('dragover', (e) => {
                e.preventDefault();
                document.querySelector('.right-panel').style.backgroundColor = '#e3f2fd';
            });
            document.querySelector('.right-panel').addEventListener('dragleave', (e) => {
                e.preventDefault();
                document.querySelector('.right-panel').style.backgroundColor = '#f9f9f9';
            });
            document.querySelector('.right-panel').addEventListener('drop', (e) => {
                e.preventDefault();
                document.querySelector('.right-panel').style.backgroundColor = '#f9f9f9';
                const file = e.dataTransfer.files[0];
                if (file && file.type.startsWith('image/')) {
                    uploadImageFile(file);
                } else {
                    alert('请上传图片文件');
                }
            });

            imageFile.addEventListener('change', (e) => {
                const file = e.target.files[0];
                if (file) uploadImageFile(file);
                e.target.value = '';
            });

            // 文本转图像（后台任务 + 轮询；完成后刷新列表并选中新文件）
            document.getElementById('textToImage').addEventListener('click', async function() {
                const text = inputText.value.trim();
                if (!text) {
                    alert('请输入文本描述');
                    return;
                }

                const originalText = this.textContent;
                this.textContent = '生成中...';
                this.disabled = true;
                setStatus(imageStatusEl, '⏳ 正在启动图像生成...');

                try {
                    const response = await fetch('/api/text-to-image', {
                        method: 'POST',
                        headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify(Object.assign({
                            text: text,
                            method: document.getElementById('imageMethod').value
                        }, collectMethodParams('imageParams')))
                    });

                    const data = await response.json();
                    if (!response.ok || data.error) throw new Error(data.error || '生成失败');
                    if (!data.started) throw new Error('任务未启动');

                    pollUntil('image',
                        (s) => setStatusFromLines(imageStatusEl, s.lines),
                        (s) => {
                            if (s.url) {
                                setStatus(imageStatusEl, '✅ 图像生成完成');
                                refreshMediaList(decodeURIComponent(s.url.split('/').pop()));
                            } else if (s.error) {
                                setStatus(imageStatusEl, '❌ 生成失败：' + s.error);
                            }
                        }
                    );

                } catch (error) {
                    setStatus(imageStatusEl, '❌ 生成失败：' + error.message);
                } finally {
                    this.textContent = originalText;
                    this.disabled = false;
                }
            });

            // 图像转文本：识别当前选中的文件（文件已在服务器 image/ 文件夹）
            document.getElementById('imageToText').addEventListener('click', async function() {
                if (!currentFile) {
                    alert('请先上传或生成图像（右侧列表选中）');
                    return;
                }

                const originalText = this.textContent;
                this.textContent = '识别中...';
                this.disabled = true;
                setStatus(captionStatusEl, '⏳ 正在启动图像识别：' + currentFile);

                try {
                    const response = await fetch('/api/image-to-text', {
                        method: 'POST',
                        headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify(Object.assign({
                            name: currentFile,
                            method: captionMethodSelect.value
                        }, collectMethodParams('captionParams')))
                    });

                    const data = await response.json();
                    if (!response.ok || data.error) throw new Error(data.error || '识别失败');
                    if (!data.started) throw new Error('任务未启动');

                    pollUntil('caption', null, (s) => {
                        if (s.result) {
                            inputText.value = s.result;
                            setStatus(captionStatusEl, '✅ 图像识别完成');
                        } else if (s.error) {
                            setStatus(captionStatusEl, '❌ 识别失败：' + s.error);
                        }
                    });

                } catch (error) {
                    setStatus(captionStatusEl, '❌ 识别失败：' + error.message);
                } finally {
                    this.textContent = originalText;
                    this.disabled = false;
                }
            });

            // ===== 页面加载：拉取文件列表（默认选中最新）+ 恢复进行中任务 =====
            (async function restore() {
                const image = await fetchTask('image');
                if (image) {
                    if (image.running) {
                        setStatusFromLines(imageStatusEl, image.lines);
                        pollUntil('image',
                            (s) => setStatusFromLines(imageStatusEl, s.lines),
                            (s) => {
                                if (s.url) { setStatus(imageStatusEl, '✅ 图像生成完成'); refreshMediaList(decodeURIComponent(s.url.split('/').pop())); }
                                else if (s.error) { setStatus(imageStatusEl, '❌ 生成失败：' + s.error); }
                            }
                        );
                    } else if (image.url) {
                        refreshMediaList(decodeURIComponent(image.url.split('/').pop()));
                    }
                }

                const caption = await fetchTask('caption');
                if (caption && caption.running) {
                    setStatus(captionStatusEl, '⏳ 图像识别进行中...');
                    pollUntil('caption', null, (s) => {
                        if (s.result) { inputText.value = s.result; setStatus(captionStatusEl, '✅ 图像识别完成'); }
                        else if (s.error) { setStatus(captionStatusEl, '❌ 识别失败：' + s.error); }
                    });
                }

                await refreshMediaList();
            })();
        });
    </script>
</body>
</html>
