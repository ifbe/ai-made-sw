<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>p2pnet</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.2.0/crypto-js.min.js"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; background: #1a1a2e; color: #eee; min-height: 100vh; padding: 20px; }
h1 { font-size: 1.2rem; margin-bottom: 16px; color: #e94560; text-align: center; }
.section { margin-bottom: 16px; }
.section-label { font-size: 0.75rem; color: #555; margin-bottom: 6px; }
.conn-row { display: flex; align-items: center; gap: 12px; }
.btn { padding: 8px 16px; border: none; border-radius: 6px; font-size: 0.9rem; cursor: pointer; }
.btn:disabled { opacity: 0.5; cursor: not-allowed; }
.btn-connect { background: #27ae60; color: #fff; }
.btn-connect:hover:not(:disabled) { background: #219653; }
.btn-disconnect { background: #555; color: #ccc; }
.btn-disconnect:hover:not(:disabled) { background: #666; }
.status { font-size: 0.85rem; }
.status .ok { color: #2ecc71; }
.status .fail { color: #e74c3c; }
.status .none { color: #555; }
hr { border: none; border-top: 1px solid #2a2a4a; margin: 16px 0; }
.row2 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 16px; }
.panel { background: #16213e; border-radius: 8px; padding: 16px; }
.panel-title { font-size: 0.8rem; color: #aaa; margin-bottom: 12px; }
.form-group { margin-bottom: 10px; }
.form-group label { display: block; font-size: 0.75rem; color: #888; margin-bottom: 4px; }
.form-group input { width: 100%; padding: 8px 10px; border: 1px solid #333; border-radius: 4px; background: #0f3460; color: #eee; font-size: 0.9rem; outline: none; }
.form-group input:focus { border-color: #e94560; }
.btn-login { width: 100%; background: #e94560; color: #fff; margin-top: 4px; }
.btn-login:hover:not(:disabled) { background: #d63a52; }
.btn-list { width: 100%; background: #0f3460; color: #e94560; border: 1px solid #e94560; }
.btn-list:hover:not(:disabled) { background: #1a4a7a; }
.result-box { margin-top: 10px; background: #0a0a1a; border-radius: 4px; padding: 8px; min-height: 60px; max-height: 150px; overflow-y: auto; font-size: 0.8rem; color: #8ab; white-space: pre-wrap; word-break: break-all; }
.result-box:empty::before { content: '(无)'; color: #444; }
.history-box { background: #0a0a1a; border-radius: 6px; padding: 12px; min-height: 80px; max-height: 200px; overflow-y: auto; font-family: 'Courier New', monospace; font-size: 0.75rem; white-space: pre-wrap; word-break: break-all; }
.history-box:empty::before { content: '(空)'; color: #444; }
.history-box .entry { margin-bottom: 4px; border-bottom: 1px solid #1a1a3a; padding-bottom: 4px; }
.history-box .entry:last-child { border-bottom: none; }
.history-box .ts { color: #555; margin-right: 6px; }
.history-box .recv { color: #3498db; }
.history-box .send { color: #27ae60; }
.history-box .err { color: #e74c3c; }
</style>
</head>
<body>
<h1>p2pnet</h1>
<div class="section">
  <div class="section-label">【连接状态】</div>
  <div class="conn-row">
    <button class="btn btn-connect" id="btn-connect" onclick="do_connect()">连接服务器</button>
    <button class="btn btn-disconnect" id="btn-disconnect" onclick="do_disconnect()" disabled>断开服务器</button>
    <span class="status" id="conn-status"><span class="none">● 未连接</span></span>
  </div>
</div>
<hr>
<div class="row2">
  <div class="panel">
    <div class="panel-title">登录</div>
    <div class="form-group"><label>用户名</label><input id="f-user" placeholder="账号"></div>
    <div class="form-group"><label>密码</label><input id="f-pass" type="password" placeholder="密码"></div>
    <button class="btn btn-login" id="btn-login" onclick="do_login()" disabled>登录</button>
  </div>
  <div class="panel">
    <div class="panel-title">已登录用户</div>
    <button class="btn btn-list" id="btn-list" onclick="do_list()">发送 list（需登录）</button>
    <div class="result-box" id="user-list">(无)</div>
  </div>
  <div class="panel">
    <div class="panel-title">自定义消息</div>
    <div class="form-group">
      <textarea id="f-raw" rows="4" placeholder='{"type":"list","username":"alice"}' style="width:100%;padding:8px 10px;border:1px solid #333;border-radius:4px;background:#0f3460;color:#eee;font-size:0.85rem;font-family:'Courier New',monospace;resize:none;outline:none;"></textarea>
    </div>
    <button class="btn" id="btn-raw" onclick="do_send_raw()" disabled style="width:100%;background:#0f3460;color:#e94560;border:1px solid #e94560;">发送</button>
  </div>
</div>
<hr>
<div class="section">
  <div class="section-label">【服务器回复】</div>
  <div class="history-box" id="history"></div>
</div>
<script>
function sha256_hex(str) { return CryptoJS.SHA256(str).toString(); }
function hex_to_word_array(hex) { return CryptoJS.enc.Hex.parse(hex); }
function hmac_sha256_hex(key_hex, data_hex) {
  // Both key and data are hex strings → convert to raw bytes before HMAC
  return CryptoJS.HmacSHA256(hex_to_word_array(data_hex), hex_to_word_array(key_hex)).toString();
}

var WS_URL = "ws://" + location.host;
var ws = null;
var logged_in = false;
var pending_user = "";
var pending_pass = "";

function set_conn(connected) {
  document.getElementById("btn-connect").disabled = connected;
  document.getElementById("btn-disconnect").disabled = !connected;
  document.getElementById("btn-login").disabled = !connected;
  document.getElementById("btn-raw").disabled = !connected;
  var s = document.getElementById("conn-status");
  s.innerHTML = connected ? '<span class="ok">● 已连接</span>' : '<span class="none">● 未连接</span>';
  if (!connected) { logged_in = false; document.getElementById("btn-list").disabled = true; document.getElementById("user-list").textContent = "(无)"; }
}
function enable_list() { document.getElementById("btn-list").disabled = !logged_in; }

function log_entry(type, text) {
  var el = document.getElementById("history");
  var d = new Date();
  var ts = String(d.getHours()).padStart(2,"0") + ":" + String(d.getMinutes()).padStart(2,"0") + ":" + String(d.getSeconds()).padStart(2,"0");
  var div = document.createElement("div");
  div.className = "entry";
  var cls = type === "recv" ? "recv" : type === "send" ? "send" : "err";
  div.innerHTML = '<span class="ts">[' + ts + ']</span><span class="' + cls + '">' + (type === "send" ? "→" : type === "err" ? "!" : "←") + " " + text + "</span>";
  el.appendChild(div);
  el.scrollTop = el.scrollHeight;
}

function do_connect() {
  if (ws) { ws.close(); ws = null; }
  try { ws = new WebSocket(WS_URL); } catch(e) { log_entry("err", "WebSocket 创建失败: " + e); set_conn(false); return; }
  ws.onopen = function() { set_conn(true); log_entry("recv", "connected"); };
  ws.onmessage = function(e) { var msg = JSON.parse(e.data); log_entry("recv", JSON.stringify(msg)); handle_msg(msg); };
  ws.onclose = function() { log_entry("recv", "disconnected"); set_conn(false); ws = null; };
  ws.onerror = function() { log_entry("err", "WebSocket 错误"); };
}
function do_disconnect() { if (ws) { ws.close(); ws = null; } set_conn(false); }

function send(obj) {
  if (ws && ws.readyState === WebSocket.OPEN) { log_entry("send", JSON.stringify(obj)); ws.send(JSON.stringify(obj)); }
  else log_entry("err", "未连接，无法发送");
}

function do_login() {
  if (!ws || ws.readyState !== WebSocket.OPEN) { log_entry("err", "未连接"); return; }
  var u = document.getElementById("f-user").value.trim();
  var p = document.getElementById("f-pass").value;
  if (!u || !p) { log_entry("err", "用户名或密码为空"); return; }
  pending_user = u; pending_pass = p;
  send({type:"login", username:u});
}

function finish_login(challenge, salt) {
  var pw_hash = sha256_hex(pending_pass + salt);
  var response = hmac_sha256_hex(pw_hash, challenge);
  send({type:"login", username:pending_user, response:response});
}

function do_list() { if (!ws || ws.readyState !== WebSocket.OPEN) return; send({type:"list"}); }

function do_send_raw() {
  if (!ws || ws.readyState !== WebSocket.OPEN) return;
  var text = document.getElementById("f-raw").value.trim();
  if (!text) return;
  try { var obj = JSON.parse(text); send(obj); } catch(e) { log_entry("err", "JSON 格式错误: " + e); }
}

function handle_msg(msg) {
  if (msg.type === "challenge") finish_login(msg.challenge, msg.salt);
  else if (msg.type === "login_ok") { logged_in = true; enable_list(); }
  else if (msg.type === "list_result") {
    var el = document.getElementById("user-list");
    if (!msg.users || msg.users.length === 0) { el.textContent = "(无在线用户)"; return; }
    el.textContent = msg.users.map(function(u) { return u.username.padEnd(16) + " " + u.ip + ":" + u.port; }).join("\n");
  } else if (msg.type === "error") log_entry("err", msg.message);
  else if (msg.type === "kicked") { logged_in = false; enable_list(); log_entry("err", "被踢: " + msg.message); }
}

document.getElementById("f-pass").addEventListener("keydown", function(e) { if (e.key === "Enter") do_login(); });
</script>
</body>
</html>
