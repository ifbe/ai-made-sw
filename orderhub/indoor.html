<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>餐厅内订单大屏 · 预览</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: #0f212f;
            font-family: 'Segoe UI', 'PingFang SC', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px;
            color: #eaf2f9;
        }
        .screen {
            width: 100%;
            max-width: 1400px;
            background: #153e54;
            border-radius: 56px;
            padding: 35px 30px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.7), inset 0 1px 3px rgba(255,255,255,0.1);
            border: 1px solid #2c6a8c;
        }
        h1 {
            font-size: 3rem;
            font-weight: 400;
            margin-bottom: 25px;
            color: #cbe4f5;
            letter-spacing: 6px;
            display: flex;
            align-items: center;
            gap: 20px;
        }
        .legend {
            display: flex;
            gap: 30px;
            font-size: 1.3rem;
            margin-left: auto;
        }
        .legend-item {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .legend-color {
            width: 24px;
            height: 24px;
            border-radius: 8px;
        }
        .legend-color.gray { background: #1f4b63; border: 1px solid #3c80a3; }
        .legend-color.green { background: #1f6e4a; border: 1px solid #7ed6a5; }

        .queue-scroll {
            overflow-x: auto;
            overflow-y: visible;
            white-space: nowrap;
            padding: 15px 5px 25px;
            display: flex;
            gap: 25px;
            scrollbar-width: thin;
            scrollbar-color: #2e7a9c #153e54;
            -webkit-overflow-scrolling: touch;
        }

        /* 订单卡片 */
        .order-card {
            display: inline-flex;
            flex-direction: column;
            min-width: 220px;
            padding: 25px 20px;
            border-radius: 28px;
            background: #1f4b63;
            box-shadow: 0 12px 0 #0b2633, 0 5px 15px black;
            border: 1px solid #3c80a3;
            transition: all 0.1s;
            cursor: pointer;
            user-select: none;
            color: white;
        }
        .order-card.green {
            background: #1f6e4a;
            border-color: #7ed6a5;
            box-shadow: 0 12px 0 #0d3a27;
        }

        .order-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 1px dashed #5f8aa5;
        }
        .order-seq {
            font-size: 2.8rem;
            font-weight: 800;
            letter-spacing: 2px;
            line-height: 1;
        }
        .table-num {
            font-size: 1.6rem;
            background: rgba(0,0,0,0.2);
            padding: 6px 16px;
            border-radius: 40px;
        }

        .dish-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin: 10px 0 15px;
        }
        .dish-item {
            font-size: 1.5rem;
            padding: 10px 14px;
            border-radius: 16px;
            background: rgba(0,0,0,0.15);
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.2s;
        }
        .dish-name {
            font-weight: 500;
        }
        .dish-progress {
            font-weight: 700;
            font-size: 1.6rem;
        }
        /* 已完成的菜品 */
        .dish-item.completed {
            color: #a8f0c6;
            background: rgba(111, 207, 151, 0.2);
            border-left: 4px solid #6fcf97;
        }
        .dish-item.completed .dish-progress {
            color: #7ed6a5;
        }

        .delete-hint {
            margin-top: 8px;
            font-size: 1.1rem;
            color: #bdd3e6;
            text-align: center;
            border-top: 1px dashed #5f8aa5;
            padding-top: 12px;
        }
        .order-card.green .delete-hint {
            color: #c3e6d4;
        }

        .empty-msg {
            font-size: 2rem;
            color: #b0c7d9;
            padding: 40px;
        }

        .swipe-note {
            margin-top: 15px;
            font-size: 1.4rem;
            color: #9dc1db;
            text-align: right;
        }
    </style>
</head>
<body>
<div class="screen">
    <h1>
        🧾 当前订单队列
        <div class="legend">
            <div class="legend-item"><span class="legend-color gray"></span> 制作中</div>
            <div class="legend-item"><span class="legend-color green"></span> 已完成待取</div>
        </div>
    </h1>
    
    <div id="orderQueueContainer" class="queue-scroll">
        <!-- 动态卡片由 JS 生成 -->
    </div>
    <div class="swipe-note">
        ⬆️ 点击绿色卡片删除 &nbsp;&nbsp;|&nbsp;&nbsp; 🖱️ 双击卡片内菜品模拟出菜进度+1
    </div>
</div>

<script>
    (function(){
        // ---------- 订单数据结构 ----------
        let orders = [
            { seq: '045', table: '5号桌', dishes: [
                { name: '宫保鸡丁', current: 1, total: 3 },
                { name: '糖醋里脊', current: 1, total: 1 },
                { name: '麻婆豆腐', current: 0, total: 2 }
            ]},
            { seq: '046', table: '3号桌', dishes: [
                { name: '酸菜鱼', current: 1, total: 1 },
                { name: '干煸豆角', current: 0, total: 2 }
            ]},
            { seq: '047', table: '8号桌', dishes: [
                { name: '宫保鸡丁', current: 2, total: 2 },
                { name: '红烧肉', current: 1, total: 1 }
            ]},
            { seq: '048', table: '2号桌', dishes: [
                { name: '糖醋里脊', current: 2, total: 3 },
                { name: '酸菜鱼', current: 0, total: 2 },
                { name: '麻婆豆腐', current: 1, total: 1 }
            ]},
            { seq: '049', table: '6号桌', dishes: [
                { name: '宫保鸡丁', current: 3, total: 3 },
                { name: '干煸豆角', current: 2, total: 2 }
            ]},
            { seq: '050', table: '1号桌', dishes: [
                { name: '红烧肉', current: 1, total: 2 },
                { name: '糖醋里脊', current: 0, total: 1 }
            ]},
            { seq: '051', table: '9号桌', dishes: [
                { name: '酸菜鱼', current: 2, total: 3 }
            ]},
            { seq: '052', table: '7号桌', dishes: [
                { name: '宫保鸡丁', current: 1, total: 1 },
                { name: '麻婆豆腐', current: 2, total: 2 },
                { name: '干煸豆角', current: 1, total: 1 }
            ]},
        ];

        const container = document.getElementById('orderQueueContainer');

        function isOrderCompleted(order) {
            return order.dishes.every(d => d.current === d.total);
        }

        function renderOrders() {
            if (orders.length === 0) {
                container.innerHTML = '<div class="empty-msg">✨ 所有订单已完成，暂无队列</div>';
                return;
            }

            let html = '';
            orders.forEach((order, index) => {
                const allCompleted = isOrderCompleted(order);
                const cardClass = allCompleted ? 'order-card green' : 'order-card';
                
                let dishesHtml = '';
                order.dishes.forEach((dish, dishIdx) => {
                    const isCompleted = dish.current === dish.total;
                    const dishClass = isCompleted ? 'dish-item completed' : 'dish-item';
                    dishesHtml += `
                        <div class="${dishClass}" data-order-index="${index}" data-dish-index="${dishIdx}">
                            <span class="dish-name">${dish.name}</span>
                            <span class="dish-progress">(${dish.current}/${dish.total})</span>
                        </div>
                    `;
                });

                html += `
                    <div class="${cardClass}" data-order-index="${index}">
                        <div class="order-header">
                            <span class="order-seq">${order.seq}</span>
                            <span class="table-num">${order.table}</span>
                        </div>
                        <div class="dish-list">
                            ${dishesHtml}
                        </div>
                        <div class="delete-hint">
                            ${allCompleted ? '⬆️ 点击卡片删除' : '⏳ 制作中'}
                        </div>
                    </div>
                `;
            });
            container.innerHTML = html;
        }

        function incrementDishProgress(orderIndex, dishIndex) {
            const order = orders[orderIndex];
            if (!order) return;
            const dish = order.dishes[dishIndex];
            if (!dish) return;
            
            if (dish.current < dish.total) {
                dish.current++;
                renderOrders();
                
                if (isOrderCompleted(order)) {
                    showToast(`✅ 订单 ${order.seq} (${order.table}) 全部完成！`);
                }
            }
        }

        function deleteOrder(orderIndex) {
            const order = orders[orderIndex];
            if (!isOrderCompleted(order)) {
                alert('只有全部菜品完成的订单（绿色）才能删除');
                return;
            }
            if (confirm(`确定删除订单 ${order.seq} (${order.table}) 吗？`)) {
                orders.splice(orderIndex, 1);
                renderOrders();
                showToast(`🗑️ 订单 ${order.seq} 已删除`);
            }
        }

        function showToast(msg) {
            const toast = document.createElement('div');
            toast.textContent = msg;
            toast.style.position = 'fixed';
            toast.style.bottom = '30px';
            toast.style.left = '50%';
            toast.style.transform = 'translateX(-50%)';
            toast.style.background = '#1e4f6b';
            toast.style.color = 'white';
            toast.style.padding = '16px 32px';
            toast.style.borderRadius = '60px';
            toast.style.fontSize = '1.5rem';
            toast.style.boxShadow = '0 10px 20px black';
            toast.style.border = '1px solid #7ab3d9';
            toast.style.zIndex = '9999';
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 2000);
        }

        // 事件委托
        container.addEventListener('click', (e) => {
            // 处理卡片点击（删除）
            const card = e.target.closest('.order-card');
            if (!card) return;
            const orderIdx = card.dataset.orderIndex;
            if (orderIdx !== undefined) {
                deleteOrder(parseInt(orderIdx));
            }
        });

        // 双击菜品项增加进度
        container.addEventListener('dblclick', (e) => {
            const dishItem = e.target.closest('.dish-item');
            if (!dishItem) return;
            
            const orderIdx = dishItem.dataset.orderIndex;
            const dishIdx = dishItem.dataset.dishIndex;
            if (orderIdx !== undefined && dishIdx !== undefined) {
                incrementDishProgress(parseInt(orderIdx), parseInt(dishIdx));
            }
        });

        renderOrders();

        const hint = document.createElement('div');
        hint.style.marginTop = '15px';
        hint.style.fontSize = '1.2rem';
        hint.style.color = '#9fc1db';
        hint.innerHTML = '💡 双击菜品模拟厨房出菜（进度+1） · 点击绿色卡片删除订单';
        document.querySelector('.screen').appendChild(hint);

        // 自动模拟出菜
        setInterval(() => {
            const incompleteOrders = orders.filter(o => !isOrderCompleted(o));
            if (incompleteOrders.length === 0) return;
            
            const randomOrder = incompleteOrders[Math.floor(Math.random() * incompleteOrders.length)];
            const incompleteDishes = randomOrder.dishes.filter(d => d.current < d.total);
            if (incompleteDishes.length === 0) return;
            
            const randomDish = incompleteDishes[Math.floor(Math.random() * incompleteDishes.length)];
            randomDish.current++;
            
            renderOrders();
            if (isOrderCompleted(randomOrder)) {
                showToast(`✅ 订单 ${randomOrder.seq} 全部完成！`);
            }
        }, 15000);
    })();
</script>
</body>
</html>
